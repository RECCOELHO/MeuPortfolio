<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7ec8e3">
    <title>Fazendinha Secreta</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fazenda/fazenda.css">
</head>

<body>
    <!-- ===== CENÁRIO ===== -->
    <div class="ceu" aria-hidden="true">
        <div class="sol"></div>
        <div class="nuvem n1"></div>
        <div class="nuvem n2"></div>
        <div class="nuvem n3"></div>
        <div class="morros"></div>
    </div>

    <!-- ===== HUD ===== -->
    <header class="hud" id="hud" hidden>
        <div class="hud-perfil">
            <div class="avatar" aria-hidden="true">🧑‍🌾</div>
            <div class="perfil-info">
                <div class="apelido" id="hudApelido">—</div>
                <div class="nivel">
                    <span class="nivel-badge" id="hudNivel">1</span>
                    <div class="xpbar" title="Experiência"><i id="hudXpBar"></i></div>
                    <span class="xp-txt" id="hudXp">0/25</span>
                </div>
            </div>
        </div>
        <div class="hud-moedas" title="Moedas"><span aria-hidden="true">🪙</span> <b id="hudMoedas">0</b></div>
        <nav class="hud-botoes">
            <button type="button" data-painel="loja"><span aria-hidden="true">🛒</span><em>Loja</em></button>
            <button type="button" data-painel="celeiro"><span aria-hidden="true">🛖</span><em>Celeiro</em><b class="contador" id="hudCeleiro" hidden>0</b></button>
            <button type="button" data-painel="conta" aria-label="Conta e ajuda"><span aria-hidden="true">⚙️</span><em>Conta</em></button>
            <a href="indexversao2.html" class="voltar" aria-label="Voltar ao portfólio"><span aria-hidden="true">↩</span><em>Sair</em></a>
        </nav>
    </header>

    <!-- ===== FAZENDA ===== -->
    <main class="cena" id="cena" hidden>
        <div class="decor" aria-hidden="true">
            <span class="casa">🏡</span>
            <span class="arvore a1">🌳</span>
            <span class="arvore a2">🌲</span>
            <span class="arvore a3">🌳</span>
            <span class="galinha g1">🐔</span>
            <span class="galinha g2">🐤</span>
            <span class="moinho">🌾</span>
        </div>
        <div class="campo-wrap">
            <div class="campo" id="campo" role="grid" aria-label="Canteiros da fazenda"></div>
        </div>
        <div class="status" id="status" aria-live="polite">Toque num canteiro para cuidar dele.</div>
    </main>

    <!-- ===== BARRA DE AÇÕES ===== -->
    <footer class="barra" id="barra" hidden>
        <button type="button" class="semente-atual" id="btnSemente" aria-label="Escolher semente">
            <span class="sem-emoji" id="semEmoji">🥬</span>
            <span class="sem-info"><small>Semente</small><b id="semNome">Alface</b></span>
        </button>
        <div class="acoes-massa">
            <button type="button" data-massa="colher"><span aria-hidden="true">🧺</span><em>Colher tudo</em></button>
            <button type="button" data-massa="cuidar"><span aria-hidden="true">🧑‍🌾</span><em>Cuidar</em></button>
            <button type="button" data-massa="arar"><span aria-hidden="true">⛏️</span><em>Arar tudo</em></button>
            <button type="button" data-massa="plantar"><span aria-hidden="true">🌱</span><em>Plantar tudo</em></button>
        </div>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="flutuantes" id="flutuantes" aria-hidden="true"></div>

    <!-- ===== ENTRADA ===== -->
    <section class="modal aberto" id="telaEntrada" role="dialog" aria-modal="true" aria-labelledby="entradaTitulo">
        <div class="cartao entrada">
            <div class="logo" aria-hidden="true">🌻</div>
            <h1 id="entradaTitulo">Fazendinha Secreta</h1>
            <p class="sub">Você achou o segredo do portfólio! Plante, cuide, colha e fique rico. 🪙</p>

            <div class="carregando" id="entradaCarregando">Abrindo a porteira…</div>

            <div class="abas" id="entradaAbas" hidden>
                <div class="abas-botoes" role="tablist">
                    <button type="button" role="tab" class="ativa" data-aba="nova" aria-selected="true">Nova fazenda</button>
                    <button type="button" role="tab" data-aba="codigo" aria-selected="false">Já tenho código</button>
                </div>
                <form class="aba ativa" data-aba="nova" id="formNova" autocomplete="off">
                    <label for="inApelido">Como te chamam na roça?</label>
                    <input id="inApelido" maxlength="20" minlength="2" required placeholder="Seu apelido">
                    <button type="submit" class="btn-principal">Começar a plantar 🌱</button>
                </form>
                <form class="aba" data-aba="codigo" id="formCodigo" autocomplete="off">
                    <label for="inCodigo">Código de recuperação</label>
                    <input id="inCodigo" required placeholder="MILHO-XXXX-XXXX" spellcheck="false" autocapitalize="characters">
                    <button type="submit" class="btn-principal">Voltar pra minha fazenda 🏡</button>
                </form>
                <p class="erro" id="entradaErro" role="alert"></p>
            </div>
        </div>
    </section>

    <!-- ===== PAINEL GENÉRICO (loja, celeiro, conta, avisos) ===== -->
    <section class="modal" id="painel" role="dialog" aria-modal="true" aria-labelledby="painelTitulo">
        <div class="cartao painel">
            <header>
                <h2 id="painelTitulo">—</h2>
                <button type="button" class="fechar" id="painelFechar" aria-label="Fechar">✕</button>
            </header>
            <div class="painel-corpo" id="painelCorpo"></div>
        </div>
    </section>

    <script src="assets/fazenda/fazenda.js" defer></script>
</body>

</html>
