<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4e974c">
    <title>Fazendinha Secreta</title>
    <link rel="icon" type="image/png" href="assets/fazenda/tiny-farm.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fazenda/fazenda.css">
</head>

<body>
    <!-- Arte: "Tiny Farm" de Kenney (www.kenney.nl), licença CC0 -->
    <canvas id="cena" class="cena" aria-label="Fazenda"></canvas>

    <!-- ===== HUD ===== -->
    <header class="hud" id="hud" hidden>
        <div class="hud-perfil caixa">
            <span data-spr="109" data-px="40"></span>
            <div class="perfil-info">
                <div class="apelido" id="hudApelido">—</div>
                <div class="nivel">
                    <span class="nivel-badge" id="hudNivel">1</span>
                    <div class="xpbar" title="Experiência"><i id="hudXpBar"></i></div>
                    <span class="xp-txt" id="hudXp">0/25</span>
                </div>
            </div>
        </div>
        <div class="hud-moedas caixa" title="Moedas"><span data-ico="moeda" data-px="20"></span><b id="hudMoedas">0</b></div>
        <nav class="hud-botoes">
            <button type="button" class="botao" data-painel="loja"><span data-spr="9" data-px="28"></span><em>Loja</em></button>
            <button type="button" class="botao" data-painel="celeiro"><span data-spr="11" data-px="28"></span><em>Celeiro</em><b class="contador" id="hudCeleiro" hidden>0</b></button>
            <button type="button" class="botao" data-painel="missoes"><span data-ico="missao" data-px="22"></span><em>Missões</em><b class="contador" id="hudMissoes" hidden>0</b></button>
            <button type="button" class="botao" data-painel="vizinhos"><span data-spr="108" data-px="28"></span><em>Vizinhos</em><b class="contador" id="hudDiario" hidden>0</b></button>
            <button type="button" class="botao" data-painel="conta" aria-label="Conta e ajuda"><span data-spr="76" data-px="28"></span><em>Conta</em></button>
            <a href="indexversao2.html" class="botao" aria-label="Voltar ao portfólio"><span data-spr="127" data-px="28"></span><em>Sair</em></a>
        </nav>
    </header>

    <div class="faixa-visita caixa" id="faixaVisita" hidden>
        <span data-spr="108" data-px="28"></span>
        <span>Fazenda de <b id="visitaApelido">—</b> · Nv <b id="visitaNivel">1</b></span>
        <button type="button" class="botao pequeno verde" id="btnVoltarCasa">Minha fazenda</button>
    </div>

    <div class="status caixa" id="status" aria-live="polite" hidden>Toque num canteiro para cuidar dele.</div>

    <!-- ===== BARRA DE AÇÕES ===== -->
    <footer class="barra" id="barra" hidden>
        <button type="button" class="botao semente-atual" id="btnSemente" aria-label="Escolher semente">
            <span id="semIcone"></span>
            <span class="sem-info"><small>Semente</small><b id="semNome">Alface</b></span>
        </button>
        <div class="acoes-massa" id="acoesVisita" hidden>
            <button type="button" class="botao" data-visita="pegar"><span data-ico="mao" data-px="26"></span><em>Pegar tudo</em></button>
            <button type="button" class="botao" data-visita="ajudar"><span data-ico="coracao" data-px="24"></span><em>Ajudar tudo</em></button>
            <button type="button" class="botao" data-visita="outro"><span data-spr="108" data-px="28"></span><em>Outro vizinho</em></button>
            <button type="button" class="botao" data-visita="casa"><span data-spr="126" data-px="28"></span><em>Voltar</em></button>
        </div>
        <div class="acoes-massa" id="acoesCasa">
            <button type="button" class="botao" data-massa="colher"><span data-spr="35" data-px="28"></span><em>Colher tudo</em></button>
            <button type="button" class="botao" data-massa="cuidar"><span data-spr="84" data-px="28"></span><em>Cuidar</em></button>
            <button type="button" class="botao" data-massa="arar"><span data-spr="86" data-px="28"></span><em>Arar tudo</em></button>
            <button type="button" class="botao" data-massa="plantar"><span data-spr="81" data-px="28"></span><em>Plantar tudo</em></button>
        </div>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="flutuantes" id="flutuantes" aria-hidden="true"></div>

    <!-- ===== ENTRADA ===== -->
    <section class="modal aberto" id="telaEntrada" role="dialog" aria-modal="true" aria-labelledby="entradaTitulo">
        <div class="cartao entrada">
            <div class="logo" aria-hidden="true"><span data-spr="83" data-px="72"></span></div>
            <h1 id="entradaTitulo">Fazendinha Secreta</h1>
            <p class="sub">Você achou o segredo do portfólio! Plante, cuide, colha e fique rico.</p>

            <div class="carregando" id="entradaCarregando">Abrindo a porteira…</div>

            <div class="abas" id="entradaAbas" hidden>
                <div class="abas-botoes" role="tablist">
                    <button type="button" role="tab" class="ativa" data-aba="nova" aria-selected="true">Nova fazenda</button>
                    <button type="button" role="tab" data-aba="codigo" aria-selected="false">Já tenho código</button>
                </div>
                <form class="aba ativa" data-aba="nova" id="formNova" autocomplete="off">
                    <label for="inApelido">Como te chamam na roça?</label>
                    <input id="inApelido" maxlength="20" minlength="2" required placeholder="Seu apelido">
                    <button type="submit" class="botao grande verde">Começar a plantar</button>
                </form>
                <form class="aba" data-aba="codigo" id="formCodigo" autocomplete="off">
                    <label for="inCodigo">Código de recuperação</label>
                    <input id="inCodigo" required placeholder="MILHO-XXXX-XXXX" spellcheck="false" autocapitalize="characters">
                    <button type="submit" class="botao grande verde">Voltar pra minha fazenda</button>
                </form>
                <p class="erro" id="entradaErro" role="alert"></p>
            </div>
        </div>
    </section>

    <!-- ===== PAINEL GENÉRICO (loja, celeiro, vizinhos, conta) ===== -->
    <section class="modal" id="painel" role="dialog" aria-modal="true" aria-labelledby="painelTitulo">
        <div class="cartao painel">
            <header>
                <h2 id="painelTitulo">—</h2>
                <button type="button" class="botao fechar" id="painelFechar" aria-label="Fechar">✕</button>
            </header>
            <div class="painel-corpo" id="painelCorpo"></div>
        </div>
    </section>

    <script src="assets/fazenda/fazenda-arte.js" defer></script>
    <script src="assets/fazenda/fazenda.js" defer></script>
</body>

</html>
